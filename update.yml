name: 초기 신호 스캐너 갱신

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 한국시간 오전 7시 (UTC 22:00)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests yfinance pytrends

      - name: 스캔 실행
        run: python early_signal_scanner.py --ci

      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "리포트 갱신"
          git push
